name: Smoke Test Production

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/production-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare deployment
        run: sleep 20
      - name: Verify production database and AI
        run: |
          set -e
          BODY=$(curl --fail --silent --show-error --retry 8 --retry-delay 5 "https://adbrain.aw5703066.workers.dev/health/deep")
          echo "$BODY"
          echo "$BODY" | grep '"ok":true'
          echo "$BODY" | grep '"database":"connected"'
          echo "$BODY" | grep '"ai":"responding"'