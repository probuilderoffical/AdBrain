name: Smoke Test Production

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare deployment and verify database + AI
        shell: bash
        run: |
          set -e
          URL="https://adbrain.aw5703066.workers.dev/health/deep"
          for i in $(seq 1 18); do
            echo "Attempt $i..."
            BODY=$(curl -sS --max-time 20 "$URL" || true)
            echo "$BODY"
            if echo "$BODY" | grep -q '"ok":true' && \
               echo "$BODY" | grep -q '"database":"connected"' && \
               echo "$BODY" | grep -q '"ai":"responding"'; then
              echo "Production DB + Workers AI smoke test passed."
              exit 0
            fi
            sleep 10
          done
          echo "Production smoke test failed after retries."
          exit 1