name: Smoke Test Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/production-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Git deployment and test health
        shell: bash
        run: |
          set -e
          URL="https://adbrain.aw5703066.workers.dev/health"
          for i in $(seq 1 18); do
            echo "Attempt $i..."
            BODY=$(curl -fsS --max-time 15 "$URL" 2>/dev/null || true)
            echo "$BODY"
            if echo "$BODY" | grep -q '"ok":true' && echo "$BODY" | grep -q '"database":"connected"' && echo "$BODY" | grep -q '"aiBinding":true'; then
              echo "Production health check passed."
              exit 0
            fi
            sleep 10
          done
          echo "Production health check failed after retries."
          exit 1

      - name: Confirm chat endpoint requires authentication
        shell: bash
        run: |
          CODE=$(curl -sS -o /tmp/chat.json -w "%{http_code}" --max-time 15 \
            -X POST "https://adbrain.aw5703066.workers.dev/chat" \
            -H "content-type: application/json" \
            --data '{"message":"health test"}')
          cat /tmp/chat.json
          test "$CODE" = "401"